openapi: 3.0.0
info:
  title: Project Management System
  version: 1.0.0
  description: >
    A RESTful API for managing projects, tasks, and comments with role-based access control.
    All protected endpoints require a Bearer JWT token obtained from `/auth/login`.
servers:
  - url: 'http://localhost:3000'
    description: Local development server
tags:
  - name: Authentication
    description: Register, login, and logout
  - name: Projects
    description: Create and manage projects, members, and status
  - name: Tasks
    description: Create, update, assign, and manage tasks within projects
  - name: Comments  
    description: Comment on tasks and manage comments
  - name: Users
    description: User account operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ─── Enums ───────────────────────────────────────────────
    Role:
      type: string
      enum: [admin, user]
 
    ProjectStatus:
      type: string
      enum: [active, archived]
 
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
 
    TaskPriority:
      type: string
      enum: [low, medium, high]
  # ─── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6a0eec205a0dabe0d64ad30a
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          $ref: '#/components/schemas/Role'
        avatar:  
          $ref: '#/components/schemas/AvatarObject'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Avatar ─────────────────────────────────────────────
    AvatarObject:
      type: object
      nullable: true
      properties:
        url:
          type: string
          example: "https://res.cloudinary.com/demo/image/upload/v1/avatars/john.jpg"
        publicId:
          type: string
          example: "avatars/john_6a0eec205a0dabe0d64ad30a"
      

    # ─── Project ─────────────────────────────────────────────
    Project:
      type: object
      properties:
        _id:
          type: string
          example: 6a1d9263a8f99944ba070066
        title:
          type: string
          example: Implement User Authentication
        description:
          type: string
          example: Allow project owners to invite members and manage project access.
        status:
          $ref: '#/components/schemas/ProjectStatus'
        ownerId:
          type: string
          example: 6a0eec205a0dabe0d64ad30a
        members:
          type: array
          items:
            type: string
          example: [6a0eec0c5a0dabe0d64ad30b]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
 
    # ─── Task ────────────────────────────────────────────────
    Task:
      type: object
      properties:
        _id:
          type: string
          example: 6a1dc57109714d00e4dd6ee1
        title:
          type: string
          example: Add Activity Logging
        description:
          type: string
          example: Track user actions such as project creation and task updates.
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
          example: '2026-04-05T00:00:00.000Z'
        assignedTo:
          type: string
          nullable: true
          example: 6a0eec0c5a0dabe0d64ad30b
        projectId:
          type: string
          example: 6a1d9263a8f99944ba070066
        createdBy:
          type: string
          example: 6a0eec205a0dabe0d64ad30a
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
 
    # ─── Comment ─────────────────────────────────────────────
    Comment:
      type: object
      properties:
        _id:
          type: string
          example: 6a1df2921ce3c86113503399
        content:
          type: string
          example: This looks good, merging now.
        taskId:
          type: string
          example: 6a1dc57109714d00e4dd6ee1
        userId:
          type: string
          example: 6a0eec205a0dabe0d64ad30a
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
 
    # ─── Validation Error ────────────────────────────────────
    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        statusCode:
          type: integer
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ['Email must be a valid email address']
            password: ['Password must be at least 8 characters long']
 
    UnauthorizedError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized
        statusCode:
          type: integer
          example: 401
 
    ForbiddenError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 
            Access denied: You are not authorized to perform this action
        statusCode:
          type: integer
          example: 403
 
    NotFoundError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Resource not found
        statusCode:
          type: integer
          example: 404
  # ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:
  
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: |
        Creates a new user account. Accepts `multipart/form-data` to support
        an optional avatar image upload (Cloudinary).

        - `avatar` is optional — max **2 MB**, formats: `png`, `jpeg`, `jpg`
        - `role` must be `admin` or `user`
        - Password is bcrypt-hashed before storage — never returned
        - On success only a confirmation is returned (no user object)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  minLength: 3
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "securePass123"
                role:
                  $ref: '#/components/schemas/Role'
                avatar:
                  type: string
                  format: binary
                  description: Optional profile image — max 2 MB, png/jpeg/jpg only
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer
                  message:
                    type: string
              example:
                success: true
                status: 201
                message: "User registered successfully"
        '400':
          description: Validation failed or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                validationError:
                  summary: DTO validation failed
                  value:
                    success: false
                    message: "Validation failed"
                    statusCode: 400
                    errors:
                      email: ["Email must be a valid email address"]
                      password: ["Password must be at least 8 characters long"]
                duplicateEmail:
                  summary: Email already registered
                  value:
                    success: false
                    statusCode: 400
                    message: "User with credentials already exists"
                fileTooLarge:
                  summary: Avatar exceeds 2 MB
                  value:
                    success: false
                    statusCode: 400
                    message: "Avatar file size cannot exceed 2MB"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and return JWT tokens
      description: >
        Validates credentials and returns a short-lived `accessToken` and a
        `refreshToken` stored server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 8
                  example: secret1234
      responses:
        '200':
          description: Login successful – JWT tokens returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Login successful
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
  
  /auth/logout:
    patch:
      tags: [Authentication]
      summary: Logout – invalidate the current access token
      description: Clears the refresh token server-side, effectively ending the session.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /auth/refresh-token:
    patch:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Issues a new `accessToken` and rotates the `refreshToken`.

        **Token source — checked in order:**
        1. `refreshToken` cookie (browser clients)
        2. `Authorization: Bearer <token>` header (mobile / CLI clients)

        The old refresh token is immediately invalidated after rotation.
        New tokens are set as cookies (`accessToken`, `refreshToken`) and also
        returned in the response body and `Authorization` header.

        **No `AuthGuard` required** — authentication is performed via the refresh token itself.
      security: []
      parameters:
        - name: refreshToken
          in: cookie
          required: false
          description: Refresh token cookie (browser clients)
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: "`Bearer <refreshToken>` — used when cookies are unavailable (mobile/CLI)"
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token refreshed — new tokens returned in body, cookies, and Authorization header
          headers:
            Authorization:
              description: New access token as `Bearer <token>`
              schema:
                type: string
                example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            Set-Cookie:
              description: Sets `accessToken` and `refreshToken` cookies
              schema:
                type: string
                example: "accessToken=eyJ...; refreshToken=eyJ..."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  accessToken:
                    type: string
                    description: New short-lived JWT — use for subsequent requests
                  refreshToken:
                    type: string
                    description: New rotated refresh token — replaces the previous one
              example:
                success: true
                message: "Token refreshed successfully"
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2YTBlZWMyMDVhMGRhYmUwZDY0YWQzMGEiLCJyb2xlIjoidXNlciIsImVtYWlsIjoiam9obkBleGFtcGxlLmNvbSIsImlhdCI6MTc0ODg2MDAwMCwiZXhwIjoxNzQ4ODYzNjAwfQ.signature"
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2YTBlZWMyMDVhMGRhYmUwZDY0YWQzMGEiLCJpYXQiOjE3NDg4NjAwMDAsImV4cCI6MTc0OTQ2NDgwMH0.signature"
        '401':
          description: Refresh token invalid, expired, revoked, or missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                missing:
                  summary: No token provided
                  value:
                    success: false
                    statusCode: 401
                    message: "Refresh token missing"
                expired:
                  summary: Token has expired
                  value:
                    success: false
                    statusCode: 401
                    message: "Refresh token expired. Please login again"
                revoked:
                  summary: Token revoked or user inactive
                  value:
                    success: false
                    statusCode: 401
                    message: "Invalid refresh token or refresh token has been revoked"
                malformed:
                  summary: Token malformed
                  value:
                    success: false
                    statusCode: 401
                    message: "Invalid or malformed authentication token"
 
  # ══════════════════════════════════════════════════════════
  # USERS
  # ══════════════════════════════════════════════════════════
  /users/upload-avatar:
    post:
      tags: [Users]
      summary: Upload or replace user avatar
      description: |
        Uploads a new avatar image to Cloudinary and updates the authenticated user's record.

        - If the user already has an avatar, **the existing Cloudinary asset is destroyed first** before uploading the new one.
        - Returns the updated user object (password, refreshToken, `__v`, timestamps excluded).

        **Guards:** `AuthGuard`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file to upload — png/jpeg/jpg
      responses:
        '201':
          description: Avatar uploaded and user record updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
              example:
                success: true
                status: 201
                message: "Avatar uploaded successfully"
                data:
                  _id: "6a0eec205a0dabe0d64ad30a"
                  name: "John Doe"
                  email: "john@example.com"
                  role: "user"
                  avatar:
                    url: "https://res.cloudinary.com/demo/image/upload/v1/avatars/john.jpg"
                    publicId: "avatars/john_6a0eec205a0dabe0d64ad30a"
        '401':
          description: Unauthorized — invalid or missing token, or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              example:
                success: false
                statusCode: 401
                message: "Unauthorized Access"
 
 # ══════════════════════════════════════════════════════════
  # PROJECTS
  # ══════════════════════════════════════════════════════════
 
  /projects:
    post:
      tags: [Projects]
      summary: Create a new project
      description: >
        Creates a project owned by the authenticated user. `members` is optional;
        `status` defaults to `active`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: Implement User Authentication
                description:
                  type: string
                  maxLength: 200
                  example: Allow project owners to invite members and manage project access.
                members:
                  type: array
                  items:
                    type: string
                  example: [6a0eec205a0dabe0d64ad30a]
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Project created successfully
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
 
    get:
      tags: [Projects]
      summary: Get all projects
      description: >
        Returns all projects visible to the authenticated user.
        Admins see every project; regular users see only projects they own or are members of.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Projects fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Projects fetched successfully
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
 
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        example: 6a1d9263a8f99944ba070066
 
    get:
      tags: [Projects]
      summary: Get project details
      description: >
        Returns full details of a single project.
        Requires the caller to be an admin, the project owner, or a member.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Project details fetched successfully
                  project:
                    $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden – not a project member/owner/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
    patch:
      tags: [Projects]
      summary: Update project
      description: >
        Updates `title`, `description`, `status`, or `members`.
        Only the project owner or an admin may call this endpoint.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                  example: Implement User Authentication V2
                description:
                  type: string
                  minLength: 10
                  example: Extended authentication module with OAuth support.
                status:
                  $ref: '#/components/schemas/ProjectStatus'
                members:
                  type: array
                  items:
                    type: string
                  example: [6a0eec0c5a0dabe0d64ad30b]
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Project updated successfully
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
    delete:
      tags: [Projects]
      summary: Delete project
      description: Permanently deletes the project. Only the project owner or an admin may do this.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Project deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
  /projects/{projectId}/toggle-status:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        example: 6a1d9263a8f99944ba070066
    patch:
      tags: [Projects]
      summary: Toggle project status
      description: >
        Changes the project's status to `active` or `archived`.
        Only the project owner or an admin may call this.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ProjectStatus'
            example:
              status: archived
      responses:
        '200':
          description: Project status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Project status updated to archived successfully
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
  /projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        example: 6a1dd82d6f4465a0db5af2fa
 
    get:
      tags: [Projects]
      summary: Get project members
      description: Returns all members of the project. Only the owner or an admin may call this.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project members fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Project members fetched successfully
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
    post:
      tags: [Projects]
      summary: Add members to project
      description: Adds one or more users to the project's member list. Only the owner or an admin may call this.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds]
              properties:
                memberIds:
                  type: array
                  items:
                    type: string
                  example: [6a0eec205a0dabe0d64ad30a, 6a0eec0c5a0dabe0d64ad30b]
      responses:
        '201':
          description: Member(s) added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Member added successfully
