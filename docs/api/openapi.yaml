          type: string
        example: 6a1d9263a8f99944ba070066
 
    post:
      tags: [Tasks]
      summary: Create a task in a project
      description: >
        Creates a task associated with the given project. The caller must be an
        admin, the project owner, or a member (`ProjectAccessGuard`).
        `assignedTo` is optional.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, priority, dueDate, projectId]
              properties:
                title:
                  type: string
                  minLength: 5
                  example: Add Activity Logging
                description:
                  type: string
                  maxLength: 300
                  example: Track user actions such as project creation, task updates, and member invitations.
                priority:
                  $ref: '#/components/schemas/TaskPriority'
                dueDate:
                  type: string
                  format: date-time
                  example: '2026-04-05T00:00:00.000Z'
                projectId:
                  type: string
                  example: 6a1d9263a8f99944ba070066
                assignedTo:
                  type: string
                  example: 6a0eec0c5a0dabe0d64ad30b
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Task created successfully
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
 
    get:
      tags: [Tasks]
      summary: Get all tasks for a project
      description: >
        Returns a paginated list of tasks for the project.
        Supports filtering by `status`, `priority`, `assignedTo`, and full-text `search`.
        Caller must be an admin, the project owner, or a member.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 5
          example: 5
        - name: search
          in: query
          schema:
            type: string
          example: activity
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - name: assignedTo
          in: query
          schema:
            type: string
          example: 6a0eec0c5a0dabe0d64ad30b
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
          example: dueDate
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Tasks fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Tasks for this project fetched successfully
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
